# Phase 2 (braid) from scratch — ablation variant (b)
# Trains directly on braid WITHOUT Phase 1 pretraining.
# Used to demonstrate curriculum learning necessity.

base: configs/base.yaml

training:
  phase: finetune
  dataset: braid            # loads braid_{train,test}
  # resume_from: (intentionally omitted) → ControlNet init from SD3.5 weights only

  epochs: 50
  batch_size: 4             # 40GB GPU 기준 (gradient_accumulation_steps: 2로 effective batch 8 유지)
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  warmup_steps: 100

  loss_weights:
    flow: 1.0
    lpips: 0.1
    lpips_warmup_frac: 0.0
    edge: 0.05

checkpointing:
  output_dir: checkpoints/phase2_braid_scratch/
  eval_every: 5
  save_every: 10
