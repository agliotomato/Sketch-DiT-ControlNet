# Ablation: Reverse Curriculum Training
# Fine-tune on unbraid after braid-only pretraining (ablation_braid_only).
# Reverse curriculum: braid pretrain → unbraid finetune.

base: configs/base.yaml

training:
  phase: finetune
  dataset: unbraid
  resume_from: checkpoints/ablation_braid_only/final.pth

  epochs: 40
  batch_size: 2
  gradient_accumulation_steps: 4   # effective batch 8
  learning_rate: 2.0e-5
  warmup_steps: 100

  loss_weights:
    flow: 1.0
    lpips: 0.1
    lpips_warmup_frac: 0.0          # 이미 perceptual 기반 있으므로 즉시 활성화
    edge: 0.0                       # unbraid는 edge loss 비활성

checkpointing:
  output_dir: checkpoints/ablation_reverse_curriculum/
  eval_every: 10
  save_every: 20
