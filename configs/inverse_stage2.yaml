# Stage 2: Inverse warm-start
# - Forward LoRA frozen (loaded from old inverse checkpoint if available)
# - Inverse LoRA initialized from Forward LoRA, then trains supervised
# - FPN decoder stabilizes on sketch-only task
# - No bidirectional, no cycle loss
# - Matte from GT (external at inference: SHS / BiSeNet)
base: configs/inverse_head.yaml

stage: 2
init_inverse_from_forward: true

# Optional: load old inverse experiment LoRA weights as forward LoRA init basis
# forward_lora_init_from: checkpoints/inverse_head/best.pth

bidirectional: false
use_gt_matte: true

training:
  epochs: 30
  cycle_start: 9999
  loss_weights:
    structure: 1.0
    color: 0.5
    tv: 0.01

checkpointing:
  output_dir: checkpoints/inverse_stage2/
  eval_every: 2
  save_every: 5

run_name: inverse_stage2
