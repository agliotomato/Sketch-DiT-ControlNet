# Inverse Head: DiT Feature Extraction + FPN Mask Decoder
#
# Data flow:
#   hair_image → frozen VAE encoder → frozen DiT (+ LoRA) → {early, mid, late} features
#   features → FPNMaskDecoder → stroke_mask + matte_pred
#   hair * matte → patch_color_sample(stroke_mask) → sketch_pred
#
# No image generation decoder. No VAE decoder output.
# Two-phase training:
#   Phase 1 (epoch 0~cycle_start): supervised (structure + color + matte + TV)
#   Phase 2 (epoch cycle_start~): + cycle loss w=0.01 via frozen forward ControlNet

base: configs/base.yaml

model:
  model_id: stabilityai/stable-diffusion-3.5-medium
  num_controlnet_layers: 12
  controlnet_checkpoint: checkpoints/phase2_braid/final.pth

lora:
  rank: 8         # LoRA rank for DiT attention (to_q/to_k/to_v of all 24 blocks)
  alpha: 8.0      # LoRA scaling factor

training:
  epochs: 50
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  warmup_steps: 200
  gradient_clip: 1.0

  # Phase 2: cycle loss 시작 epoch — resume from best.pth (epoch=5) → 즉시 phase 2
  cycle_start: 5    # 5 이상이면 cycle 진입; best.pth는 epoch=5 → resume 시 첫 step부터 alternating

  loss_weights:
    structure: 1.0      # BCE: stroke_mask vs GT
    color: 0.5          # L1 stroke-weighted: sketch_pred vs sketch_GT
    matte: 1.0          # BCE + L1 + Dice: matte_pred vs matte_GT
    tv: 0.01            # Total Variation: stroke mask smoothness
    cycle: 0.01         # Phase 2: forward ControlNet feature MSE
    lpips_cycle: 0.05   # Phase 2: TRUE round-trip LPIPS via forward_CN + DiT(CN-injected)

# Cycle step memory split: cycle is heavier than supervised (forward_CN + 2nd DiT pass + VGG)
# Splits cycle batch into N micro-batches with gradient accumulation. supervised step uses full bs.
cycle_micro_batches: 4    # bs=4 → 4 × bs=1 in cycle step

backbone_lr_scale: 0.1    # back_blocks (12-23) LR = base_lr × 0.1 (gentler fine-tuning)

grid_size: 16             # patch color sampling 크기

checkpointing:
  output_dir: checkpoints/inverse_head/
  eval_every: 2     # was 5 — Phase 2에서 cycle 효과 빨리 확인하려면 더 자주
  save_every: 5     # was 10 — 더 자주 epoch_X.pth 저장 (안전망)
